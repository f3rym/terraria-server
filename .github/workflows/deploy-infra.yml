name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'entrypoint.sh'
  workflow_dispatch:

jobs:
  deploy:
    name: Rebuild & restart server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull, rebuild & restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            git lfs pull
            docker compose down
            docker compose build --pull
            docker compose up -d
